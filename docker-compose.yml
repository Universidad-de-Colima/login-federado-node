## Proyecto prueba: Apache (front + proxy) y API Node en una sola imagen
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASS}"]
      interval: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: http://localhost:${PHPMYADMIN_PORT}/
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy

  # Una sola imagen: Apache sirve el front en /prueba y hace proxy de /prueba/api/v1 a Node.
  proyecto:
    build: .
    image: prueba:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    # Todas las variables del .env llegan al contenedor (las usa la API NestJS)
    env_file: .env
    environment:
      # Dentro de la red de Docker la BD es el servicio `db`
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./cert:/var/www/prueba/cert:ro
      - public_content:${PUBLIC_CONTENT_PATH}
      - private_content:${PRIVATE_CONTENT_PATH}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
  public_content:
  private_content:
