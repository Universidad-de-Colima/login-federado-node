# Nombre global del servidor (evita el aviso AH00558 al arrancar)
ServerName localhost

<VirtualHost *:80>
    ServerName datacenter.ucol.mx
    ServerAdmin webmaster@localhost

    # =========================
    #   PROXY A LA API (Node)
    # =========================
    # Debe ir antes de los Alias: /prueba/api/v1 NO es un directorio del front.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass        /prueba/api/v1 http://127.0.0.1:3000/prueba/api/v1
    ProxyPassReverse /prueba/api/v1 http://127.0.0.1:3000/prueba/api/v1

    # URL de callback registrada en el IdP de UCOL: se reenvía a la ruta con prefijo
    ProxyPass        /api/auth/ http://127.0.0.1:3000/prueba/api/v1/auth/
    ProxyPassReverse /api/auth/ http://127.0.0.1:3000/prueba/api/v1/auth/

    # =========================
    #       FRONTEND (SPA)
    # =========================
    DocumentRoot /var/www/html
    RedirectMatch ^/$ /prueba/
    # Archivos públicos subidos (private_content NO se publica). Va antes que /prueba.
    Alias /prueba/public_content /var/www/prueba/public_content
    <Directory /var/www/prueba/public_content>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /prueba /var/www/prueba/web

    <Directory /var/www/prueba/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Rutas del SPA (React Router): cualquier ruta que no sea archivo carga el index
        FallbackResource /prueba/index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
